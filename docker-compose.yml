# Local development services for WorkPulse.
# Production uses managed equivalents (see Architecture.md section 2).
#
#   docker compose up -d      start Postgres
#   docker compose down       stop it (data is kept in the named volume)

services:
  postgres:
    image: postgres:17-alpine
    container_name: workpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: workpulse
      POSTGRES_DB: workpulse
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulse -d workpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
